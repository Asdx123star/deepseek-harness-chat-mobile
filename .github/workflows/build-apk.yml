name: Build Android APK v0.5.2 Embedded Harness Audited

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "DeepSeekHarnessChat_v*_native_source.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

env:
  NODE_ANDROID_VERSION: "24.18.1"
  ANDROID_NDK_VERSION: "27.2.12479018"
  ANDROID_CMAKE_VERSION: "3.22.1"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
  DSH_NPM_VERSION: "0.1.0-rc.6"

jobs:
  build:
    # Pin the runner image so compiler/tool locations do not silently change under ubuntu-latest.
    runs-on: ubuntu-24.04
    # The first arm64 build compiles Node/V8/ICU from source on a 2-core hosted
    # runner. The audited run reached GitHub's previous 90-minute cutoff while
    # still compiling successfully; later runs restore the cached runtime.
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 24 for packaging Harness
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Pick newest source package
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(find . -maxdepth 1 -type f -name 'DeepSeekHarnessChat_v*_native_source.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$SRC" ]; then
            echo "No source zip found" >&2
            exit 1
          fi
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "Using $SRC"

      - name: Validate and unpack source
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$SRC" >/dev/null
          rm -rf build-src
          mkdir build-src
          unzip -q "$SRC" -d build-src

          # v0.5.2 was authored against the pre-release Harness composition. rc.6
          # made attachments, directory picking, and permission presets explicit
          # API-gateway dependencies. Adapt the audited text-only Android profile
          # before it is smoke-tested and packaged.
          python3 - <<'PY'
          from pathlib import Path

          patch = Path('build-src/android/app/src/main/assets/nodejs-project/bootstrap/cordis.patch.yml')
          text = patch.read_text(encoding='utf-8')
          old = '''- id: attachment-local
            disabled: true

          - id: directory-picker
            disabled: true
          '''
          new = '''# The API gateway requires an attachment service even for a text-only client.
          # Its implementation is replaced after npm install with an Android-safe stub.
          # The desktop sandbox chain imports native Koffi/Landlock binaries at module
          # load time. No shell or filesystem tools are exposed by the mobile preset.
          - id: sandbox
            disabled: true

          - id: sandbox-policy
            disabled: true

          - id: fs-sandbox
            disabled: true

          - id: directory-picker
            name: '@deepseek-ai/dsh-host-directory-picker-browse'

          # Permission presets require a desktop shell service. This app intentionally
          # exposes no shell, so the optional selector must stay disabled.
          - id: permission
            disabled: true
          '''
          if text.count(old) != 1:
              raise SystemExit('Unexpected Android Cordis overlay; refusing an unsafe compatibility patch')
          patch.write_text(text.replace(old, new, 1), encoding='utf-8')

          runtime = Path('build-src/android/app/src/main/java/com/example/dshchat/EmbeddedHarnessRuntime.kt')
          text = runtime.read_text(encoding='utf-8')
          old_args = '''arrayOf(
                              "node",
                              entry.absolutePath,
          '''
          new_args = '''arrayOf(
                              "node",
                              "--expose-internals",
                              entry.absolutePath,
          '''
          if text.count(old_args) != 1:
              raise SystemExit('Unexpected embedded Node argv layout')
          text = text.replace(old_args, new_args, 1)
          old_asset = 'val version = "0.5.2-node24"'
          new_asset = 'val version = "0.5.2-node24-rc6-android1"'
          if text.count(old_asset) != 1:
              raise SystemExit('Unexpected embedded asset version')
          runtime.write_text(text.replace(old_asset, new_asset, 1), encoding='utf-8')
          PY

          test -f build-src/android/app/build.gradle.kts
          test -f build-src/android/app/src/main/cpp/native-lib.cpp
          test -f build-src/android/app/src/main/assets/nodejs-project/main.mjs
          node --check build-src/android/app/src/main/assets/nodejs-project/main.mjs
          grep -q 'versionName = "0.5.2"' build-src/android/app/build.gradle.kts
          grep -q 'ndkVersion = "27.2.12479018"' build-src/android/app/build.gradle.kts
          grep -q 'cxx_std_20' build-src/android/app/src/main/cpp/CMakeLists.txt
          grep -q 'argv(static_cast<size_t>(argc) + 1, nullptr)' build-src/android/app/src/main/cpp/native-lib.cpp
          grep -q 'android:allowBackup="false"' build-src/android/app/src/main/AndroidManifest.xml
          grep -q -- '"--expose-internals"' build-src/android/app/src/main/java/com/example/dshchat/EmbeddedHarnessRuntime.kt
          grep -q "name: '@deepseek-ai/dsh-host-directory-picker-browse'" build-src/android/app/src/main/assets/nodejs-project/bootstrap/cordis.patch.yml
          grep -A1 -q -- '- id: permission' build-src/android/app/src/main/assets/nodejs-project/bootstrap/cordis.patch.yml
          grep -A1 -q -- '- id: sandbox' build-src/android/app/src/main/assets/nodejs-project/bootstrap/cordis.patch.yml

      - name: Embed Blue Fantasy whale wallpaper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-src/android/app/src/main/res/drawable-nodpi
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            'https://raw.githubusercontent.com/zhu1090093659/dsh-web-ui/77a48a25cc41211b593a72ef6c6d195b72016f10/packages/skins/blue-fantasy/src/client/art.ts' \
            -o /tmp/blue-fantasy-art.ts
          python3 - <<'PY'
          import base64, pathlib, re
          text = pathlib.Path('/tmp/blue-fantasy-art.ts').read_text(encoding='utf-8')
          m = re.search(r'data:image/jpeg;base64,([A-Za-z0-9+/=]+)', text)
          if not m:
              raise SystemExit('Blue Fantasy wallpaper data URL not found')
          out = pathlib.Path('build-src/android/app/src/main/res/drawable-nodpi/blue_fantasy_wallpaper.jpg')
          data = base64.b64decode(m.group(1), validate=True)
          if not data.startswith(b'\xff\xd8\xff'):
              raise SystemExit('Blue Fantasy resource is not a JPEG')
          out.write_bytes(data)
          print(f'Embedded Blue Fantasy wallpaper: {out.stat().st_size} bytes')
          PY

      # Run the exact JS entrypoint before the expensive Android Node build. This catches
      # broken Harness packages/config/API routes in ~1 minute instead of after ~15 minutes.
      - name: Package and smoke-test official DeepSeek Harness
        shell: bash
        run: |
          set -euxo pipefail
          TEMPLATE="$GITHUB_WORKSPACE/build-src/android/app/src/main/assets/nodejs-project"
          test -f "$TEMPLATE/main.mjs"
          node --check "$TEMPLATE/main.mjs"
          rm -rf /tmp/dsh-node-project
          cp -a "$TEMPLATE" /tmp/dsh-node-project
          rm -rf "$TEMPLATE"

          cd /tmp/dsh-node-project
          cat > package.json <<JSON
          {
            "name": "dsh-android-embedded-runtime",
            "private": true,
            "type": "module",
            "dependencies": {
              "@deepseek-ai/dsh": "${DSH_NPM_VERSION}"
            }
          }
          JSON

          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          test -f node_modules/@deepseek-ai/dsh/lib/bin.js
          node -e 'const p=require("./node_modules/@deepseek-ai/dsh/package.json"); if (p.version !== process.env.DSH_NPM_VERSION) { console.error(p.version); process.exit(1) }'
          npm ls --omit=dev --depth=0

          # sharp and Loader's internal-module fallback ship desktop native addons.
          # Android has no compatible binaries, while this app is deliberately text-only.
          # Keep the required attachments service but replace its backend with pure JS,
          # then prove the embedded project contains no host .node binaries.
          ATTACHMENT_ENTRY=node_modules/@deepseek-ai/dsh-attachment-local/lib/index.js
          cat > "$ATTACHMENT_ENTRY" <<'JS'
          import { AttachmentError, AttachmentStore } from '@deepseek-ai/dsh-attachment'

          const unsupported = () => {
            throw new AttachmentError(
              'Image attachments are not supported by the Android text-only client.',
              'UNSUPPORTED_ATTACHMENT'
            )
          }

          class AndroidTextAttachmentStore extends AttachmentStore {
            imageLimits = Object.freeze({
              maxImageBytes: 1,
              maxImagesPerMessage: 1,
              maxMessageImageBytes: 1,
              maxImagePixels: 1,
              mediaTypes: Object.freeze(['image/png'])
            })

            async validateImage() { unsupported() }
            async saveImage() { unsupported() }
            async readImage() { unsupported() }
          }

          export { AndroidTextAttachmentStore, AndroidTextAttachmentStore as default }
          JS
          node --check "$ATTACHMENT_ENTRY"
          find node_modules -type f -name '*.node' -print -delete
          test -z "$(find node_modules -type f -name '*.node' -print -quit)"

          SMOKE_APP=/tmp/dsh-smoke-app
          rm -rf "$SMOKE_APP"
          mkdir -p "$SMOKE_APP"
          node --expose-internals main.mjs "$SMOKE_APP" >/tmp/dsh-smoke.log 2>&1 &
          SMOKE_PID=$!
          cleanup_smoke() {
            kill "$SMOKE_PID" 2>/dev/null || true
            wait "$SMOKE_PID" 2>/dev/null || true
          }
          trap cleanup_smoke EXIT

          READY=0
          for _ in $(seq 1 60); do
            if ! kill -0 "$SMOKE_PID" 2>/dev/null; then
              cat /tmp/dsh-smoke.log
              exit 1
            fi
            if curl -fsS -H 'content-type: application/json' \
              --data '{"type":"client-request","rpcId":"smoke-list","method":"session.list","payload":{}}' \
              http://127.0.0.1:37128/api/session.list >/tmp/dsh-list.json 2>/dev/null; then
              READY=1
              break
            fi
            sleep 0.5
          done
          if [ "$READY" != 1 ]; then
            cat /tmp/dsh-smoke.log
            echo 'Embedded Harness entrypoint did not become ready' >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/dsh-list.json'))
          assert d.get('result',{}).get('ok') is True, d
          PY

          curl -fsS -H 'content-type: application/json' \
            --data '{"type":"client-request","rpcId":"smoke-create","method":"session.create","payload":{"agentPreset":"mobile-chat"}}' \
            http://127.0.0.1:37128/api/session.create >/tmp/dsh-create.json
          SID="$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/dsh-create.json'))
          assert d.get('result',{}).get('ok') is True, d
          print(d['result']['value']['sessionId'])
          PY
          )"
          test -n "$SID"

          curl -fsS -H 'content-type: application/json' \
            --data "{\"type\":\"client-request\",\"rpcId\":\"smoke-models\",\"method\":\"session.models\",\"payload\":{\"sessionId\":\"$SID\"}}" \
            http://127.0.0.1:37128/api/session.models >/tmp/dsh-models.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/dsh-models.json'))
          assert d.get('result',{}).get('ok') is True, d
          groups=d['result']['value']['groups']
          deep=next((g for g in groups if g.get('id')=='deepseek-official'), None)
          assert deep, groups
          models={m['id']:m for m in deep.get('models',[])}
          for mid in ('deepseek-v4-flash','deepseek-v4-pro'):
              assert mid in models, models
              efforts={e['id'] for e in models[mid].get('reasoning',{}).get('efforts',[])}
              assert {'off','high','max'} <= efforts, (mid, efforts)
          PY

          curl -fsS -H 'content-type: application/json' \
            --data '{"type":"client-request","rpcId":"smoke-creds","method":"credentials.describe","payload":{"refs":["DEEPSEEK_API_KEY"]}}' \
            http://127.0.0.1:37128/api/credentials.describe >/tmp/dsh-creds.json
          curl -fsS -H 'content-type: application/json' \
            --data '{"type":"client-request","rpcId":"smoke-settings","method":"settings.describe","payload":{}}' \
            http://127.0.0.1:37128/api/settings.describe >/tmp/dsh-settings.json
          curl -fsS -H 'content-type: application/json' \
            --data '{"type":"client-request","rpcId":"smoke-search","method":"session.search","payload":{"query":"__android_smoke__"}}' \
            http://127.0.0.1:37128/api/session.search >/tmp/dsh-search.json
          curl -fsS http://127.0.0.1:37129/__dsh_mobile/config >/tmp/dsh-proxy.json

          python3 - <<'PY'
          import json
          for p in ('/tmp/dsh-creds.json','/tmp/dsh-settings.json','/tmp/dsh-search.json'):
              d=json.load(open(p)); assert d.get('result',{}).get('ok') is True, (p,d)
          p=json.load(open('/tmp/dsh-proxy.json'))
          assert p.get('upstreamBaseURL') == 'https://api.deepseek.com', p
          PY

          cleanup_smoke
          trap - EXIT
          echo 'Exact embedded Harness entrypoint smoke test passed.'

          cd "$GITHUB_WORKSPACE"
          mkdir -p build-src/android/app/src/main/assets
          (cd /tmp/dsh-node-project && zip -qry "$GITHUB_WORKSPACE/build-src/android/app/src/main/assets/nodejs-project.zip" .)
          unzip -t build-src/android/app/src/main/assets/nodejs-project.zip >/dev/null
          unzip -l build-src/android/app/src/main/assets/nodejs-project.zip | grep -q 'node_modules/@deepseek-ai/dsh/lib/bin.js'
          unzip -l build-src/android/app/src/main/assets/nodejs-project.zip | grep -q 'bootstrap/cordis.patch.yml'
          unzip -l build-src/android/app/src/main/assets/nodejs-project.zip | grep -q 'main.mjs'
          if unzip -Z1 build-src/android/app/src/main/assets/nodejs-project.zip | grep '\.node$' >/tmp/dsh-native-addons.txt; then
            cat /tmp/dsh-native-addons.txt
            echo 'Host native addons must not be embedded in the Android project' >&2
            exit 1
          fi
          unzip -p build-src/android/app/src/main/assets/nodejs-project.zip \
            node_modules/@deepseek-ai/dsh-attachment-local/lib/index.js | grep -q 'AndroidTextAttachmentStore'
          ls -lh build-src/android/app/src/main/assets/nodejs-project.zip
          rm -rf /tmp/dsh-node-project "$SMOKE_APP"

      - name: Cache Android Node 24 shared runtime
        id: node-cache
        uses: actions/cache@v4
        with:
          path: .cache/dsh-android-node24
          key: dsh-node-${{ env.NODE_ANDROID_VERSION }}-android-arm64-ndk-${{ env.ANDROID_NDK_VERSION }}-shared-audited-v3

      - name: Build Node 24 shared library for Android arm64
        if: steps.node-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld python3 pkg-config ninja-build patch patchelf binutils

          # Never hard-code /usr/bin/llvm-ar or a specific clang symlink: hosted-runner
          # images install several LLVM versions side-by-side. The Linux host tools only
          # build GYP's obj.host helpers; the Android target still uses the NDK clang.
          CC_host="$(command -v gcc)"
          CXX_host="$(command -v g++)"
          AR_host="$(command -v ar)"
          test -x "$CC_host"
          test -x "$CXX_host"
          test -x "$AR_host"
          echo "Linux host tools: CC_host=$CC_host CXX_host=$CXX_host AR_host=$AR_host"

          NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TARGET_CC="$NDK_BIN/aarch64-linux-android26-clang"
          TARGET_CXX="$NDK_BIN/aarch64-linux-android26-clang++"
          test -x "$TARGET_CC"
          test -x "$TARGET_CXX"
          echo "Android target tools: $TARGET_CC / $TARGET_CXX"

          rm -rf /tmp/node-android
          git clone --depth 1 --branch "v${NODE_ANDROID_VERSION}" https://github.com/nodejs/node.git /tmp/node-android
          cd /tmp/node-android

          # Node's official Android helper has no flag passthrough. Patch only its pinned
          # configure invocation to add the official --shared option used by embedders.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android_configure.py')
          s = p.read_text()
          old = ' --openssl-no-asm --cross-compiling")'
          new = ' --openssl-no-asm --cross-compiling --shared")'
          if old not in s:
              raise SystemExit('Node android_configure.py layout changed; refusing an unsafe patch')
          p.write_text(s.replace(old, new, 1))
          PY

          # configure.py uses CC_host to detect host_arch. These must exist BEFORE
          # android-configure; otherwise obj.host can accidentally be generated for arm64.
          export CC_host CXX_host AR_host
          ./android-configure "$ANDROID_NDK_ROOT" 26 arm64

          grep -Eq "host_arch.*x64" config.gypi || { echo 'host_arch is not x64'; grep -n 'host_arch' config.gypi || true; exit 1; }
          grep -Eq "target_arch.*arm64" config.gypi || { echo 'target_arch is not arm64'; grep -n 'target_arch' config.gypi || true; exit 1; }
          grep -Eq "node_shared.*true" config.gypi || { echo 'node_shared was not enabled'; grep -n 'node_shared' config.gypi || true; exit 1; }

          # Preserve GYP's existing linker flags and append 16 KiB ELF segment alignment.
          cat >> out/Makefile <<'MAKEFLAGS_APPEND'
          LDFLAGS.target += -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384
          MAKEFLAGS_APPEND

          # Suppress thousands of echoed compiler command lines. This keeps the
          # Actions log usable without changing warnings, errors, or parallelism.
          make -s -j2 \
            CC.host="$CC_host" \
            CXX.host="$CXX_host" \
            LINK.host="$CXX_host" \
            AR.host="$AR_host"

          LIBNODE="$(find out/Release -maxdepth 3 \( -type f -o -type l \) -name 'libnode.so*' -print | sort -V | head -n 1)"
          test -n "$LIBNODE"
          test -e "$LIBNODE"
          echo "Built libnode candidate: $LIBNODE"

          CACHE="$GITHUB_WORKSPACE/.cache/dsh-android-node24"
          rm -rf "$CACHE"
          mkdir -p "$CACHE/lib" "$CACHE/headers/src" "$CACHE/headers/deps/v8" "$CACHE/headers/deps/uv"
          cp -L "$LIBNODE" "$CACHE/lib/libnode.so"

          READELF="$NDK_BIN/llvm-readelf"
          NM="$NDK_BIN/llvm-nm"
          test -x "$READELF"
          test -x "$NM"
          "$READELF" -h "$CACHE/lib/libnode.so" | grep -q 'Machine:.*AArch64'

          SONAME="$($READELF -d "$CACHE/lib/libnode.so" | sed -n 's/.*(SONAME).*\[\(.*\)\].*/\1/p' | head -n 1)"
          echo "Original libnode SONAME: ${SONAME:-<none>}"
          if [ "$SONAME" != "libnode.so" ]; then
            patchelf --help 2>&1 | grep -q -- '--page-size' || { echo 'patchelf lacks --page-size'; exit 1; }
            patchelf --page-size 16384 --set-soname libnode.so "$CACHE/lib/libnode.so"
          fi

          "$READELF" -d "$CACHE/lib/libnode.so" | grep -q '(SONAME).*\[libnode.so\]'
          "$NM" -D -C "$CACHE/lib/libnode.so" | grep -F 'node::Start(int, char**)' >/dev/null || {
            echo 'libnode does not export node::Start(int, char**)'; exit 1;
          }

          cp -a src/*.h "$CACHE/headers/src/"
          cp -a deps/v8/include "$CACHE/headers/deps/v8/"
          cp -a deps/uv/include "$CACHE/headers/deps/uv/"

          "$READELF" -d "$CACHE/lib/libnode.so" | grep NEEDED || true
          if "$READELF" -d "$CACHE/lib/libnode.so" | grep -Eq 'libstdc\+\+\.so\.6|libgcc_s\.so\.1|libc\.so\.6|ld-linux'; then
            echo 'libnode contains Linux/glibc host dependencies; Android cross build is invalid' >&2
            exit 1
          fi

          python3 - "$READELF" "$CACHE/lib/libnode.so" <<'PY'
          import subprocess, sys
          readelf, lib = sys.argv[1:]
          text = subprocess.check_output([readelf, '-lW', lib], text=True)
          aligns=[]
          for line in text.splitlines():
              parts=line.split()
              if parts and parts[0]=='LOAD': aligns.append(int(parts[-1],0))
          if not aligns: raise SystemExit('No ELF LOAD segments found in libnode')
          print('libnode LOAD alignments:', [hex(x) for x in aligns])
          if min(aligns) < 16384: raise SystemExit('libnode is not 16 KiB aligned')
          PY

          rm -rf /tmp/node-android

      - name: Stage embedded Node runtime and headers into Android project
        shell: bash
        run: |
          set -euxo pipefail
          test -s .cache/dsh-android-node24/lib/libnode.so
          mkdir -p build-src/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p build-src/android/app/src/main/cpp/node-headers/src
          mkdir -p build-src/android/app/src/main/cpp/node-headers/deps/v8
          mkdir -p build-src/android/app/src/main/cpp/node-headers/deps/uv
          cp .cache/dsh-android-node24/lib/libnode.so build-src/android/app/src/main/jniLibs/arm64-v8a/libnode.so
          cp -a .cache/dsh-android-node24/headers/src/. build-src/android/app/src/main/cpp/node-headers/src/
          cp -a .cache/dsh-android-node24/headers/deps/v8/. build-src/android/app/src/main/cpp/node-headers/deps/v8/
          cp -a .cache/dsh-android-node24/headers/deps/uv/. build-src/android/app/src/main/cpp/node-headers/deps/uv/
          test -f build-src/android/app/src/main/cpp/node-headers/src/node.h
          test -f build-src/android/app/src/main/cpp/node-headers/deps/v8/include/v8.h
          test -f build-src/android/app/src/main/cpp/node-headers/deps/uv/include/uv.h

      - name: Build debug APK
        working-directory: build-src/android
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon assembleDebug

      - name: Audit APK embedded runtime
        shell: bash
        run: |
          set -euxo pipefail
          APK=build-src/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          rm -rf /tmp/apk-audit
          mkdir -p /tmp/apk-audit
          unzip -q "$APK" -d /tmp/apk-audit

          test -s /tmp/apk-audit/lib/arm64-v8a/libnode.so
          test -s /tmp/apk-audit/lib/arm64-v8a/libdshbridge.so
          test -s /tmp/apk-audit/assets/nodejs-project.zip
          unzip -t /tmp/apk-audit/assets/nodejs-project.zip >/dev/null
          unzip -l /tmp/apk-audit/assets/nodejs-project.zip | grep -q 'node_modules/@deepseek-ai/dsh/lib/bin.js'
          unzip -l /tmp/apk-audit/assets/nodejs-project.zip | grep -q 'bootstrap/mobile-chat/agent.cordis.yml'
          unzip -l /tmp/apk-audit/assets/nodejs-project.zip | grep -q 'main.mjs'
          if unzip -Z1 /tmp/apk-audit/assets/nodejs-project.zip | grep '\.node$' >/tmp/apk-native-addons.txt; then
            cat /tmp/apk-native-addons.txt
            echo 'Host native addons were found inside the APK' >&2
            exit 1
          fi
          unzip -p /tmp/apk-audit/assets/nodejs-project.zip \
            node_modules/@deepseek-ai/dsh-attachment-local/lib/index.js | grep -q 'AndroidTextAttachmentStore'

          NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          READELF="$NDK_BIN/llvm-readelf"
          NM="$NDK_BIN/llvm-nm"
          "$READELF" -h /tmp/apk-audit/lib/arm64-v8a/libnode.so | grep -q 'Machine:.*AArch64'
          "$READELF" -d /tmp/apk-audit/lib/arm64-v8a/libnode.so | grep -q '(SONAME).*\[libnode.so\]'
          "$READELF" -d /tmp/apk-audit/lib/arm64-v8a/libdshbridge.so | grep -q '(NEEDED).*\[libnode.so\]'
          "$NM" -D /tmp/apk-audit/lib/arm64-v8a/libdshbridge.so | grep -q 'Java_com_example_dshchat_EmbeddedHarnessRuntime_startNodeWithArguments'

          python3 - "$READELF" /tmp/apk-audit/lib/arm64-v8a/libnode.so /tmp/apk-audit/lib/arm64-v8a/libdshbridge.so <<'PY'
          import subprocess, sys
          readelf, *libs = sys.argv[1:]
          for lib in libs:
              text = subprocess.check_output([readelf, '-lW', lib], text=True)
              aligns = [int(line.split()[-1], 0) for line in text.splitlines() if line.split() and line.split()[0] == 'LOAD']
              if not aligns or min(aligns) < 16384:
                  raise SystemExit(f'{lib} is not 16 KiB aligned: {aligns}')
              print(lib, 'LOAD alignments', [hex(x) for x in aligns])
          PY

          if "$READELF" -d /tmp/apk-audit/lib/arm64-v8a/libnode.so | grep -q 'libc++_shared.so'; then
            test -s /tmp/apk-audit/lib/arm64-v8a/libc++_shared.so
          fi

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK"

          echo 'APK embedded-runtime audit passed.'
          du -h "$APK"

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output
          cp build-src/android/app/build/outputs/apk/debug/app-debug.apk \
             apk-output/HarnessChat-v0.5.2-embedded-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HarnessChat-v0.5.2-Embedded-APK
          path: apk-output/HarnessChat-v0.5.2-embedded-debug.apk
          if-no-files-found: error
