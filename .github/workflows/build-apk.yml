name: Build Android APK v0.5 Embedded Harness Fix 1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "DeepSeekHarnessChat_v*_native_source.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

env:
  NODE_ANDROID_VERSION: "24.18.1"
  ANDROID_NDK_VERSION: "27.2.12479018"
  ANDROID_CMAKE_VERSION: "3.22.1"
  DSH_NPM_VERSION: "0.1.0-rc.5"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 24 for packaging Harness
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Pick newest source package
        shell: bash
        run: |
          SRC="$(find . -maxdepth 1 -type f -name 'DeepSeekHarnessChat_v*_native_source.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$SRC" ]; then
            echo "No source zip found" >&2
            exit 1
          fi
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "Using $SRC"

      - name: Unpack source
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q "$SRC" -d build-src

      - name: Embed exact Blue Fantasy whale wallpaper
        shell: bash
        run: |
          mkdir -p build-src/android/app/src/main/res/drawable-nodpi
          curl -fsSL --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/zhu1090093659/dsh-web-ui/refs/heads/main/packages/skins/blue-fantasy/src/client/art.ts' \
            -o /tmp/blue-fantasy-art.ts
          python3 - <<'PY'
          import base64, pathlib, re
          text = pathlib.Path('/tmp/blue-fantasy-art.ts').read_text(encoding='utf-8')
          m = re.search(r'data:image/jpeg;base64,([A-Za-z0-9+/=]+)', text)
          if not m:
              raise SystemExit('Blue Fantasy wallpaper data URL not found')
          out = pathlib.Path('build-src/android/app/src/main/res/drawable-nodpi/blue_fantasy_wallpaper.jpg')
          out.write_bytes(base64.b64decode(m.group(1)))
          print(f'Embedded Blue Fantasy wallpaper: {out.stat().st_size} bytes')
          PY

      - name: Cache Android Node 24 shared runtime
        id: node-cache
        uses: actions/cache@v4
        with:
          path: .cache/dsh-android-node24
          key: dsh-node-${{ env.NODE_ANDROID_VERSION }}-android-arm64-ndk-${{ env.ANDROID_NDK_VERSION }}-shared-v3

      - name: Build Node 24 shared library for Android arm64
        if: steps.node-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y make g++ python3 pkg-config ninja-build patch
          rm -rf /tmp/node-android
          git clone --depth 1 --branch "v${NODE_ANDROID_VERSION}" https://github.com/nodejs/node.git /tmp/node-android
          cd /tmp/node-android

          # Node's official Android helper fixes the cross toolchain but does not expose
          # extra configure flags. Add --shared so Android can load Node from the APK via JNI
          # instead of copying/executing a binary from writable app storage.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android_configure.py')
          s = p.read_text()
          old = ' --openssl-no-asm --cross-compiling")'
          new = ' --openssl-no-asm --cross-compiling --shared")'
          if old not in s:
              raise SystemExit('Node android_configure.py layout changed; cannot add --shared safely')
          p.write_text(s.replace(old, new, 1))
          PY

          ./android-configure "$ANDROID_NDK_ROOT" 26 arm64

          # GYP generates two toolchains in a cross build:
          #   target = Android/arm64, host = the GitHub runner itself (Linux/x64).
          # Node's Android helper exports CC/CXX for the Android target. On this
          # Node 24 build that also leaks into obj.host, causing V8 host sources
          # to be compiled against Android/Bionic headers (e.g. backtrace() fails).
          # Force the host toolset back to Ubuntu's native compiler while leaving
          # CC.target/CXX.target on the NDK toolchain generated above.
          HOST_CC="$(command -v gcc)"
          HOST_CXX="$(command -v g++)"
          HOST_AR="$(command -v ar)"
          echo "Host compiler: $HOST_CC / $HOST_CXX"
          echo "Android target compiler: $CC / $CXX"
          make -j2 \
            CC.host="$HOST_CC" \
            CXX.host="$HOST_CXX" \
            LINK.host="$HOST_CXX" \
            AR.host="$HOST_AR"

          LIBNODE="$(find out/Release -type f \( -name 'libnode.so' -o -name 'libnode.so.*' \) | head -n 1)"
          test -n "$LIBNODE"
          mkdir -p "$GITHUB_WORKSPACE/.cache/dsh-android-node24/lib" \
                   "$GITHUB_WORKSPACE/.cache/dsh-android-node24/headers/src" \
                   "$GITHUB_WORKSPACE/.cache/dsh-android-node24/headers/deps/v8" \
                   "$GITHUB_WORKSPACE/.cache/dsh-android-node24/headers/deps/uv"
          cp -L "$LIBNODE" "$GITHUB_WORKSPACE/.cache/dsh-android-node24/lib/libnode.so"
          cp -a src/*.h "$GITHUB_WORKSPACE/.cache/dsh-android-node24/headers/src/"
          cp -a deps/v8/include "$GITHUB_WORKSPACE/.cache/dsh-android-node24/headers/deps/v8/"
          cp -a deps/uv/include "$GITHUB_WORKSPACE/.cache/dsh-android-node24/headers/deps/uv/"
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d "$GITHUB_WORKSPACE/.cache/dsh-android-node24/lib/libnode.so" | grep NEEDED || true

      - name: Stage embedded Node runtime and headers into Android project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-src/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p build-src/android/app/src/main/cpp/node-headers/src
          mkdir -p build-src/android/app/src/main/cpp/node-headers/deps/v8
          mkdir -p build-src/android/app/src/main/cpp/node-headers/deps/uv
          cp .cache/dsh-android-node24/lib/libnode.so build-src/android/app/src/main/jniLibs/arm64-v8a/libnode.so
          cp -a .cache/dsh-android-node24/headers/src/. build-src/android/app/src/main/cpp/node-headers/src/
          cp -a .cache/dsh-android-node24/headers/deps/v8/. build-src/android/app/src/main/cpp/node-headers/deps/v8/
          cp -a .cache/dsh-android-node24/headers/deps/uv/. build-src/android/app/src/main/cpp/node-headers/deps/uv/

          # If the shared Node build needs libc++_shared, put the matching NDK copy beside it.
          CXX_SHARED="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          if [ -f "$CXX_SHARED" ]; then
            cp "$CXX_SHARED" build-src/android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          fi

      - name: Package official DeepSeek Harness into APK assets
        shell: bash
        run: |
          set -euxo pipefail
          TEMPLATE="build-src/android/app/src/main/assets/nodejs-project"
          test -f "$TEMPLATE/main.mjs"
          rm -rf /tmp/dsh-node-project
          cp -a "$TEMPLATE" /tmp/dsh-node-project
          rm -rf "$TEMPLATE"

          cd /tmp/dsh-node-project
          cat > package.json <<JSON
          {
            "name": "dsh-android-embedded-runtime",
            "private": true,
            "type": "module",
            "dependencies": {
              "@deepseek-ai/dsh": "${DSH_NPM_VERSION}"
            }
          }
          JSON

          # Native desktop addons are intentionally not built in this chat-only Android profile.
          # The home overlay and mobile-chat preset never mount PTY/subprocess/attachment rows.
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          test -f node_modules/@deepseek-ai/dsh/lib/bin.js

          cd "$GITHUB_WORKSPACE"
          mkdir -p build-src/android/app/src/main/assets
          (cd /tmp/dsh-node-project && zip -qry "$GITHUB_WORKSPACE/build-src/android/app/src/main/assets/nodejs-project.zip" .)
          ls -lh build-src/android/app/src/main/assets/nodejs-project.zip

      - name: Build debug APK
        working-directory: build-src/android
        run: gradle --no-daemon assembleDebug

      - name: Inspect APK embedded runtime
        shell: bash
        run: |
          unzip -l build-src/android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/arm64-v8a/(libnode|libdshbridge)|assets/nodejs-project.zip' || true

      - name: Collect APK
        run: |
          mkdir -p apk-output
          cp build-src/android/app/build/outputs/apk/debug/app-debug.apk \
             apk-output/HarnessChat-v0.5.0-embedded-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HarnessChat-v0.5.0-Embedded-APK
          path: apk-output/HarnessChat-v0.5.0-embedded-debug.apk
          if-no-files-found: error
